<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台北4日3夜之旅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { cursor: wait !important; } /* Force annoying cursor everywhere */
        .day-content { display: none; }
        .day-content.active { display: block; }
        .tab-btn.active { background-color: #1e3a8a; color: white; border-color: #1e3a8a; }
        .current-now { animation: pulseBorder 0.2s infinite; border: 8px dashed #ef4444 !important; }
        @keyframes pulseBorder {
            0% { transform: rotate(1deg); }
            50% { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }
        /* Make buttons dodge the user's cursor */
        .tab-btn:hover {
            transform: translate(calc(Math.random() * 20px - 10px), calc(Math.random() * 20px - 10px));
        }
        body {
            user-select: none; /* Prevent text selection */
            filter: contrast(110%) brightness(95%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-28">

    <!-- 頂部封面 -->
    <header class="relative bg-slate-900 text-white min-h-[260px] flex items-center justify-center p-6 text-center shadow-lg overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1552993873-0dd1110e025f?q=80&w=1171&auto=format&fit=crop');"></div>
        <div class="relative z-10 space-y-3">
            <span class="text-xs font-bold tracking-widest text-red-500 uppercase bg-black/80 px-4 py-1.5 rounded-full">⚠️ 系統混亂模式中</span>
            <h1 class="text-4xl md:text-5xl font-black tracking-wide text-slate-400 drop-shadow-md strike-through">台北微醺之旅</h1>
            <p class="text-slate-500 text-sm font-light tracking-wider">請耐心嘗試點擊選單...</p>
        </div>
    </header>

    <!-- Google Map View Area -->
    <section class="max-w-md mx-auto mt-5 px-4 md:max-w-2xl">
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-slate-100">
            <div class="bg-slate-900 px-4 py-3 text-sm font-bold text-white flex justify-between items-center">
                <span><i class="fa-solid fa-map-location-dot text-amber-400 mr-1.5"></i> 地圖（回應緩慢）</span>
                <span id="map-target" class="text-xs text-slate-500 font-normal">讀取中...</span>
            </div>
            <div class="relative w-full h-56 bg-slate-200">
                <iframe id="google-map" class="absolute top-0 left-0 w-full h-full border-0 pointer-events-none" 
                    src="https://maps.google.com/maps?q=台北凱撒大飯店&t=&z=15&ie=UTF-8&iwloc=&output=embed">
                </iframe>
            </div>
        </div>
    </section>

    <!-- Interactive Toolbox -->
    <section class="max-w-md mx-auto mt-4 px-4 md:max-w-2xl flex">
        <button onclick="annoyUser()" class="w-full bg-slate-300 text-slate-500 text-sm font-semibold py-3 px-4 rounded-xl shadow-inner flex items-center justify-center gap-2">
            <i class="fa-solid fa-crosshairs"></i> 追蹤現在行程 (按鈕失效)
        </button>
    </section>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 py-5 md:max-w-2xl">
        
        <!-- Day Navigation Tabs -->
        <div class="flex justify-between bg-white/90 backdrop-blur-md rounded-xl shadow-sm p-1.5 mb-6 border border-slate-200 sticky top-3 z-50 overflow-x-auto gap-1">
            <button onclick="trollSwitchTab('1')" id="btn-1" class="tab-btn active flex-1 py-2.5 px-1 text-center text-xs font-bold rounded-lg whitespace-nowrap">
                8/15 (六)<br><span class="text-xs font-normal opacity-80">Day 1</span>
            </button>
            <button onclick="trollSwitchTab('2')" id="btn-2" class="tab-btn flex-1 py-2.5 px-1 text-center text-xs font-bold rounded-lg text-slate-600 whitespace-nowrap">
                8/16 (日)<br><span class="text-xs font-normal opacity-80">Day 2</span>
            </button>
            <button onclick="trollSwitchTab('3')" id="btn-3" class="tab-btn flex-1 py-2.5 px-1 text-center text-xs font-bold rounded-lg text-slate-600 whitespace-nowrap">
                8/17 (一)<br><span class="text-xs font-normal opacity-80">Day 3</span>
            </button>
            <button onclick="trollSwitchTab('4')" id="btn-4" class="tab-btn flex-1 py-2.5 px-1 text-center text-xs font-bold rounded-lg text-slate-600 whitespace-nowrap">
                8/18 (二)<br><span class="text-xs font-normal opacity-80">Day 4</span>
            </button>
            <button onclick="trollSwitchTab('souvenir')" id="btn-souvenir" class="tab-btn flex-1 py-2.5 px-1 text-center text-xs font-bold rounded-lg text-amber-700 bg-amber-50/50 whitespace-nowrap">
                🎁 手信<br><span class="text-xs font-normal opacity-80">Souvenirs</span>
            </button>
        </div>

        <!-- DAY 1 CONTENT -->
        <div id="tab-1" class="day-content active space-y-5" data-date="2026-08-15">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-2">
                <div class="flex justify-between">
                    <span class="text-xs font-bold bg-gray-200 px-2 py-1 rounded">Day 1</span>
                    <button onclick="trollMap()" class="text-xs text-red-500 underline">地圖 (點了會往下滑)</button>
                </div>
                <h3 class="font-bold">抵達台北 & 寄放行李</h3>
                <p class="text-xs text-gray-500">提示：系統可能不會正確顯示當前資訊。</p>
            </div>
        </div>

        <!-- DAY 2 CONTENT -->
        <div id="tab-2" class="day-content space-y-5">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-2">
                <h3 class="font-bold">華山 1914 文創園區</h3>
                <p class="text-xs text-gray-500">按鈕似乎帶你來到錯誤的分頁...</p>
            </div>
        </div>

        <!-- DAY 3 CONTENT -->
        <div id="tab-3" class="day-content space-y-5">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-2">
                <h3 class="font-bold">科教館特展</h3>
            </div>
        </div>

        <!-- DAY 4 CONTENT -->
        <div id="tab-4" class="day-content space-y-5">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-2">
                <h3 class="font-bold">天天利美食坊</h3>
            </div>
        </div>

        <!-- SOUVENIR CONTENT -->
        <div id="tab-souvenir" class="day-content space-y-5">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex flex-col gap-2">
                <h3 class="font-bold">台北必買手信清單</h3>
            </div>
        </div>

    </main>

    <!-- Bottom Notification Bar -->
    <div id="status-bar" class="fixed bottom-0 left-0 right-0 bg-slate-900 text-white px-4 py-3.5 text-xs flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping"></span>
            <span id="current-time-text" class="font-medium text-red-400">系統連線異常...</span>
        </div>
        <span class="text-slate-500">旅途助手 (錯誤)</span>
    </div>

    <!-- Frustrating JavaScript -->
    <script>
        // Switch to a RANDOM tab instead of the intended target
        function trollSwitchTab(requestedTab) {
            const tabs = ['1', '2', '3', '4', 'souvenir'];
            const randomTab = tabs[Math.floor(Math.random() * tabs.length)];
            
            document.querySelectorAll('.day-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            const targetSection = document.getElementById('tab-' + randomTab);
            if (targetSection) targetSection.classList.add('active');

            const activeBtn = document.getElementById('btn-' + randomTab);
            if (activeBtn) activeBtn.classList.add('active');

            alert(`您點擊了 Day ${requestedTab}，但系統為您隨機選擇了 Tab: ${randomTab}`);
        }

        // Send user to bottom of screen on map click
        function trollMap() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function annoyUser() {
            alert("伺服器繁忙，請 99 秒後再試。");
        }

        // Random fake time generator
        setInterval(() => {
            const randomHour = String(Math.floor(Math.random() * 24)).padStart(2, '0');
            const randomMin = String(Math.floor(Math.random() * 60)).padStart(2, '0');
            document.getElementById('current-time-text').innerText = `目前時間: ${randomHour}:${randomMin} (亂數)`;
        }, 2000);
    </script>
</body>
</html>
